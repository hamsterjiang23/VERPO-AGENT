[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "VERPO-AGENT"
version = "0.3.0"
description = "Agent feedback replay, GRPO distillation and pinned veRL integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
verpo-agent = "verpo_agent.__main__:main"

[project.optional-dependencies]
environment-service = ["fastapi==0.116.1", "uvicorn==0.35.0", "pyyaml==6.0.2"]
cpu = [
  "torch==2.8.0", "numpy==2.2.6", "tensordict==0.10.0",
  "omegaconf==2.3.0", "hydra-core==1.3.2", "transformers==4.56.2",
  "ray==2.48.0", "TransferQueue==0.1.8", "datasets==4.0.0", "torchdata==0.11.0",
  "accelerate==1.10.1", "peft==0.17.1", "codetiming==1.4.0", "pillow==11.3.0",
  "psutil==7.0.0", "scipy==1.15.3", "pybind11==3.0.1", "uvicorn==0.35.0",
  "fastapi==0.116.1", "cachetools==6.2.0", "pybase64==1.4.2"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["verpo_agent*"]
